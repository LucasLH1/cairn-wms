# Avancement de Cairn WMS
#
# Source unique : le contenu de docs/. Un module n'est porté ici que s'il figure
# dans la carte des modules de docs/README.md. Rien n'est extrapolé.
#
# États possibles, dans l'ordre du cycle de vie :
#
#   à faire            le module est identifié, rien n'est écrit
#   spécifié           la spécification métier est rédigée et lisible dans docs/
#   en développement   la réalisation est engagée
#   livré              la réalisation est en production sur main
#
# Tous les modules de la carte sont aujourd'hui « spécifié ». Aucun n'est
# « en développement » ni « livré » : le dépôt ne contient aucun code applicatif,
# et aucune pile technique n'est choisie. La seule décision actée, 0001, porte
# sur l'ordre de réalisation en lots (section « lots » ci-dessous).
#
# Le champ « issue » renvoie à l'issue GitHub qui porte le travail restant sur
# le module : « Réaliser ... » pour un module spécifié. Pour le module 0.9, qui
# ne décrit aucun écran, c'est l'issue « Choisir la pile technique », dont la
# grille d'évaluation est ce module.
#
# Les jalons GitHub restent par couche. Leur passage à un découpage par lot se
# fera quand le scénario du lot 1 sera écrit.
#
# À tenir à jour à chaque session, en même temps que journal/ et les issues.

projet: Cairn WMS
