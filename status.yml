# Découpage en lots livrables, acté par docs/decisions/0003-precision-du-decoupage-en-lots.md,
# qui remplace 0001. Un lot est clos quand ses scénarios, écrits sous docs/lots/,
# sont automatisés en tests de bout en bout qui passent, et que les moments listés
# dans le README du lot ont été constatés à l'écran. Un module est traversé par
# plusieurs lots et revient à chacun d'eux. Les fonctions transverses de 0.8 ne
# forment pas un lot : elles naissent au lot 1 dans leur forme simple et
# s'enrichissent à chaque lot. Les scénarios d'un lot s'écrivent juste avant sa
# réalisation.

lots:

  - id: 1
    nom: L'entrepôt minimal
    etat: à faire
    jalon: Lot 1 — L'entrepôt minimal
    contenu: >-
      Un donneur d'ordre, un site, gestion quantitative. Attendu saisi à la main,
      réception au quai, supports simples créés et étiquetés dès le quai,
      rangement, commande, prélèvement, comptage ponctuel, expédition par un
      transporteur sans interface automatisée. Un écart de réception est
      enregistré sans ouvrir de litige (RG-REC-071). Parcours par défaut non
      paramétrable (RG-WKF-005). Une stratégie de rangement, régime libre,
      débordement. Journal d'événements et tâches dès ce lot. Fonctions de 0.8
      dans leur forme simple : file de décisions, main, recherche et lecture de
      code-barres, alertes dans l'application, impression des étiquettes de
      support et des documents de flux.
    prouve: La marchandise entre, se range, se prélève, sort, et le stock se corrige.
    criteres: docs/lots/lot-1/README.md
    maquette: docs/lots/lot-1/maquette.html
    scenarios:
      - doc: docs/lots/lot-1/reception-et-rangement.md
        issue: 48
      - doc: docs/lots/lot-1/commande-et-preparation.md
        issue: 49
      - doc: docs/lots/lot-1/controle-colisage-expedition.md
        issue: 50

  - id: 2
    nom: L'identité et la multiplicité
    etat: à faire
    contenu: >-
      Numéro de série, lot, multi-donneurs d'ordre réel, rôles, équipes,
      hiérarchie et périmètres, second site et transferts inter-sites, supports
      consignés, blocages et quarantaine, inventaires tournants et complets,
      réception aveugle et contrôle qualité, réception à la volée et
      rapprochement, création rapide d'une référence au quai, stratégies de
      rangement multiples, régime dirigé et dérogation, prélèvement dédié,
      réapprovisionnement, éclatement et cross-dock, exemplaire désigné, mode
      groupé et zone de tri, réservation à l'acceptation ou au prélèvement,
      premier périmé premier sorti, regroupement de commandes, choix du site et
      du service transporteur par règles, contrôle par sondage, vague sur heure
      limite, volume ou poids, départ incomplet et annulation d'expédition.
    prouve: Le produit distingue les exemplaires, les donneurs d'ordre et les sites.

  - id: 3
    nom: Le SAV
    etat: à faire
    contenu: >-
      Dossiers, retours client, parcours configurables, atelier et réparation,
      litiges, étiquette et bon de retour.
    prouve: Ce qui différencie le produit fonctionne.

  - id: 4
    nom: La mesure
    etat: à faire
    contenu: >-
      Unités d'œuvre, photo quotidienne, relevés d'activité, indicateurs,
      comparaison d'activité.
    prouve: Le prestataire peut facturer et piloter.

  - id: 5
    nom: L'ouverture
    etat: à faire
    contenu: >-
      Profils d'import, échanges automatisés, portail donneur d'ordre,
      interfaçage direct, tarification, espace technique, commande injectée par
      flux, transporteurs avec interface automatisée — étiquette, suivi,
      indisponibilité.
    prouve: >-
      Le produit se branche sur le système d'un donneur d'ordre, et s'installe
      et s'exploite sans l'éditeur.
