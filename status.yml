# Avancement de Cairn WMS
#
# Source unique : le contenu de docs/. Un module n'est porté ici que s'il figure
# dans la carte des modules de docs/README.md. Rien n'est extrapolé.
#
# États possibles, dans l'ordre du cycle de vie :
#
#   à faire            le module est identifié, rien n'est écrit
#   spécifié           la spécification métier est rédigée et lisible dans docs/
#   en développement   la réalisation est engagée
#   livré              la réalisation est en production sur main
#
# Aucun module n'est aujourd'hui « en développement » ni « livré » : le dépôt ne
# contient aucun code applicatif, et aucune pile technique n'est choisie.
#
# À tenir à jour à chaque session, en même temps que journal/ et les issues.

