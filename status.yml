# Découpage en lots livrables, acté par docs/decisions/0001-decoupage-en-lots-livrables.md.
# Un lot est clos quand un scénario complet se déroule de bout en bout sur le
# jeu de données de test, écran par écran. Un module est traversé par plusieurs
# lots et revient à chacun d'eux. Les fonctions transverses de 0.8 ne forment
# pas un lot : elles naissent au lot 1 dans leur forme simple et s'enrichissent
# à chaque lot.

lots:

  - id: 1
    nom: L'entrepôt minimal
    etat: à faire
    contenu: >-
      Un donneur d'ordre, un site, gestion quantitative seule. Recevoir, ranger,
      prélever, expédier. Socle dans sa version pauvre : ni série, ni lot, ni
      parcours configurable.
    prouve: La marchandise entre et sort.

  - id: 2
    nom: L'identité et la multiplicité
    etat: à faire
    contenu: >-
      Numéro de série, lot, supports, multi-donneurs d'ordre réel, rôles,
      équipes, hiérarchie, périmètres.
    prouve: Le produit distingue les exemplaires et les clients.

  - id: 3
    nom: Le SAV
    etat: à faire
    contenu: >-
      Dossiers, retours client, parcours configurables, atelier et réparation.
    prouve: Ce qui différencie le produit fonctionne.

  - id: 4
    nom: La mesure
    etat: à faire
    contenu: >-
      Unités d'œuvre, photo quotidienne, relevés d'activité, indicateurs,
      comparaison d'activité.
    prouve: Le prestataire peut facturer et piloter.

  - id: 5
    nom: L'ouverture
    etat: à faire
    contenu: >-
      Profils d'import, échanges automatisés, portail donneur d'ordre,
      interfaçage direct, tarification.
    prouve: Le produit se branche sur le système d'un client.
